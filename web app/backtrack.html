<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BackTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- CSS tag for the styling of the webpage-->
  <style>

   
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
    /*color palette --CSS variables/design tokens*/
    :root {
      --cream:    #F2EDE3;
      --sage:     #8A9E7B;
      --sage-dk:  #6B7D60;
      --sage-lt:  #C4D3B9;
      --amber:    #E8963A;
      --amber-lt: #F5C878;
      --green:    #5BA668;
      --red:      #C94F42;
      --text:     #2E2B26;
      --text-muted: #7A7570;
      --card-bg:  #FFFFFF;
      --border:   rgba(0,0,0,0.10);
    }
    /*setting overall background*/
    body {
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* header  */
    .header {
      text-align: center;
      animation: fadeDown 0.5s ease both;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      letter-spacing: 0.08em;
      color: var(--text);
      line-height: 1;
    }
    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* cards */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }
    .card:nth-child(2) { animation-delay: 0.08s; }
    .card:nth-child(3) { animation-delay: 0.16s; }

    .card-header { /*formats the header of each card*/
      background: var(--sage);
      padding: 0.6rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .card-header-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-bottom: 0.2rem;
    }
    .card-header-value {
      font-size: 1rem;
      font-weight: 500;
      color: #fff;
    }
    .card-header-right {
      text-align: right;
    }

    /* Live-rating row -- indicates good, okay, poor */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .rating-pill {
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      transition: background 0.4s, color 0.4s;
    }
    .rating-pill.good  { background: rgba(91,166,104,0.22); color: #3d8a4e; }
    .rating-pill.okay  { background: rgba(232,150,58,0.22); color: #b06a10; }
    .rating-pill.poor  { background: rgba(201,79,66,0.22);  color: #9b2b20; }

    .slash { color: rgba(255,255,255,0.4); font-size: 0.85rem; }

    /* live dot -- animations upon poor posture behavior to draw attention*/
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      transition: background 0.4s;
    }
    .live-dot.good { background: var(--green); box-shadow: 0 0 0 3px rgba(91,166,104,0.3); }
    .live-dot.okay { background: var(--amber); box-shadow: 0 0 0 3px rgba(232,150,58,0.3); }
    .live-dot.poor { background: var(--red);   box-shadow: 0 0 0 3px rgba(201,79,66,0.3); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(201,79,66,0.3); }
      50%      { box-shadow: 0 0 0 6px rgba(201,79,66,0.1); }
    }

    /* Current/Day/Week/Month tabs -- for now, these segments are filled with dummy data*/
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 0.65rem 0.5rem;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .tab:hover { background: rgba(0,0,0,0.03); }
    .tab.active {
      color: var(--amber);
      border-bottom-color: var(--amber);
      background: rgba(232,150,58,0.06);
    }

    /*charts for historic user data*/
    .chart-wrap {
      padding: 1rem 1.25rem 1.25rem;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 230px;
    }
    .chart-summary {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
      font-style: italic;
    }
    .chart-summary span { color: var(--text); font-weight: 500; }

    /* insights grid for stat boxes */
    .insights-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: 1.25rem;
    }
    .insight-card {
      background: var(--cream);
      border-radius: 10px;
      padding: 1rem;
      border: 1px solid var(--border);
      text-align: center;
    }
    .insight-val {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }
    .insight-label {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    /* time of day bar*/
    .tod-section {
      padding: 0 1.25rem 1.25rem;
    }
    .tod-title {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }
    .tod-bars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      align-items: end;
    }
    .tod-bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .tod-bar-bg {
      width: 100%;
      height: 60px;
      background: var(--cream);
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .tod-bar-fill {
      width: 100%;
      border-radius: 5px;
      transition: height 0.6s ease;
    }
    .tod-bar-label { font-size: 0.68rem; color: var(--text-muted); }
    .tod-bar-pct   { font-size: 0.72rem; font-weight: 600; color: var(--text); }

    /* ANIMATIONS  */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /*FOOTER / WEBSOCKET NOTE : shows the firebase connection state */
    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      padding-bottom: 1rem;
      opacity: 0.7;
    }
    .ws-badge {
      display: inline-block;
      background: rgba(138,158,123,0.15);
      color: var(--sage-dk);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.3rem;
    }
  </style>
</head>
<body>
<div class="app">


<!--HTML ELEMENT CODE!!-->
  <!-- HEADER -->
  <div class="header">
    <div class="logo">BACKTRACK</div>

  </div>

  <!--session status card (bottom card -- shows posture percentage)-->
<!--session status card-->
<div class="card" id="session-card">

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<!--JAVASCRIPT CODE BELOW-->
<script>

/* 
   MOCK/DUMMY DATA  — will be overwritten with Firebase data 
   */

const RATINGS = { GOOD: 2, OKAY: 1, POOR: 0 };

// Simulated live state (gets overwritten upon DB connection)
let liveState = { rating: 'GOOD', sessionStart: Date.now() };
let sessionActive = false;

// ADDED: only for percentage behavior
let selectedTab = 'current';
let totalSamples = 0;
let goodSamples = 0;

const tabPercentages = {
  day: 62,
  week: 58,
  month: 64
};

// NOTE: no outputBaseUrl anymore — session control now goes through Firebase
// instead of a direct HTTP call to the output ESP. This sidesteps client-isolation
// issues on phone hotspots and lets the dashboard work from any network.

// dummy scatter plot data for the day/week/month tabs
const mockData = {
  current: generateSession(40, 'current'), //starts empty and fills up with real data
  day:     generateSession(80, 'day'),
  week:    generateSession(120, 'week'),
  month:   generateSession(200, 'month'),
};
// generates n fake data points for each tab using random walk algorithm
function generateSession(n, tab) {
  const points = [];
  let rating = 2;
  const maxX = tab === 'current' ? 30 : tab === 'day' ? 720 : tab === 'week' ? 168 : 720;
  for (let i = 0; i < n; i++) {
    rating += (Math.random() - 0.5) * 1.2;
    rating = Math.max(0, Math.min(2, rating));
    points.push({ x: parseFloat(((i / n) * maxX).toFixed(1)), y: parseFloat(rating.toFixed(2)) });
  }
  return points;
}

/* updateTimer: redundant timer for duration of posture event */
function updateTimer() {
  if (!sessionActive) return;

  const elapsed = Math.floor((Date.now() - liveState.sessionStart) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
}
setInterval(updateTimer, 1000);

 //  LIVE RATING UI -- updaters all the visual elemnts that reflect current posture behavior rating
  
function applyRating(rating) {
  if (rating === 'INACTIVE') {
    showInactiveSession();
    return;
  }

  const dot  = document.getElementById('live-dot');
  const pill = document.getElementById('rating-pill');
  const cls  = rating.toLowerCase();

  dot.style.background = "";
  dot.style.boxShadow = "";
  dot.className  = `live-dot ${cls}`;
  console.log('dot name: ', dot.className);
  pill.className = `rating-pill ${cls}`;
  pill.textContent = rating;

  // ADDED: current tab percentage only
  if (selectedTab === "current") {
    totalSamples++;
    if (rating === "GOOD") goodSamples++;

    const pct = totalSamples === 0 ? 0 :
      Math.round((goodSamples / totalSamples) * 100);

    document.getElementById('good-pct').textContent = pct + "%";
  }
}
// Initial placeholder until Firebase responds
applyRating(liveState.rating);

function showInactiveSession() {
  const dot  = document.getElementById('live-dot');
  const pill = document.getElementById('rating-pill');

  dot.className = 'live-dot';
  dot.style.background = '#bdb8b2';
  dot.style.boxShadow = 'none';

  pill.className = 'rating-pill';
  pill.textContent = 'INACTIVE';
  pill.style.background = 'rgba(255,255,255,0.18)';
  pill.style.color = '#fff';

  document.getElementById('timer-display').textContent = '00:00';
}

// toggleSession is now defined inside the Firebase module script below
// and attached to window so this button's onclick can reach it.
// We only define a stub here so the button doesn't throw before Firebase loads.
function toggleSession() {
  if (window.__toggleSession) {
    window.__toggleSession();
  } else {
    console.warn('Firebase not ready yet, please wait a moment and try again.');
  }
}

function updateSessionButton() {
  const btn = document.getElementById('session-toggle-btn');
  btn.textContent = sessionActive ? 'Stop Session' : 'Start Session';
}

/*creates Chart.js scatter chart on the postureChart elemnt */
const ctx = document.getElementById('postureChart').getContext('2d');

const axisLabels = { 0: 'poor', 1: 'okay', 2: 'good' };

const dotColors = (ctx) => {
  const y = ctx.parsed.y;
  if (y >= 1.5) return '#5BA668';
  if (y >= 0.75) return '#E8963A';
  return '#C94F42';
};

const chart = new Chart(ctx, {
  type: 'scatter',
  data: {
    datasets: [{
      data: mockData.current,
      pointBackgroundColor: dotColors,
      pointBorderColor: 'transparent',
      pointRadius: 5,
      pointHoverRadius: 7,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 400 },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => {
            const y = ctx.parsed.y;
            const label = y >= 1.5 ? 'Good' : y >= 0.75 ? 'Okay' : 'Poor';
            return ` ${label} posture`;
          }
        }
      }
    },
    scales: {
      x: {
        type: 'linear',
        min: 0,
        grid: { color: 'rgba(0,0,0,0.05)' },
        ticks: {
          color: '#7A7570',
          font: { family: 'DM Sans', size: 10 },
          callback: (v) => `${v}m`
        },
        title: {
          display: true,
          text: 'time (min)',
          color: '#7A7570',
          font: { family: 'DM Sans', size: 10 }
        }
      },
      y: {
        min: -0.2,
        max: 2.2,
        grid: {
          color: (ctx) => ctx.tick.value === 1 ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.04)',
        },
        ticks: {
          stepSize: 1,
          color: '#7A7570',
          font: { family: 'DM Sans', size: 10 },
          callback: (v) => axisLabels[v] ?? ''
        }
      }
    }
  }
});

/* Th functions that occur onclick  */
const tabLabels = {
  current: { xLabel: 'time (min)', xSuffix: 'm', trend: 'improved' },
  day:     { xLabel: 'time (min)', xSuffix: 'm', trend: 'worsened slightly' },
  week:    { xLabel: 'time (hr)',  xSuffix: 'h', trend: 'improved' },
  month:   { xLabel: 'time (hr)', xSuffix: 'h', trend: 'held steady' },
};

function switchTab(tab, el) {
  selectedTab = tab;

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  const cfg = tabLabels[tab];
  chart.data.datasets[0].data = mockData[tab];
  chart.options.scales.x.title.text = cfg.xLabel;
  chart.options.scales.x.ticks.callback = (v) => `${v}${cfg.xSuffix}`;
  chart.update();

  document.getElementById('summary-trend').textContent = cfg.trend;

  // ADDED: update percentage when switching tabs
  if (tab === "current") {
    const pct = totalSamples === 0 ? 0 :
      Math.round((goodSamples / totalSamples) * 100);
    document.getElementById('good-pct').textContent = pct + "%";
  } else {
    document.getElementById('good-pct').textContent =
      (tabPercentages[tab] || 0) + "%";
  }
}

/* hardcoding data for time of day bars (morning, midday, evening, night*/
const todData = [
  { label: 'Morning', pct: 78, color: '#5BA668' },
  { label: 'Midday',  pct: 55, color: '#E8963A' },
  { label: 'Evening', pct: 47, color: '#E8963A' },
  { label: 'Night',   pct: 30, color: '#C94F42' },
];

const todContainer = document.getElementById('tod-bars');
todData.forEach(d => {
  todContainer.innerHTML += `
    <div class="tod-bar-wrap">
      <div class="tod-bar-pct">${d.pct}%</div>
      <div class="tod-bar-bg">
        <div class="tod-bar-fill" style="height:${d.pct}%; background:${d.color}; opacity:0.75;"></div>
      </div>
      <div class="tod-bar-label">${d.label}</div>
    </div>`;
});

/* 
   FIREBASE — normalise value from ESP32
   "GOOD" → GOOD, "OKAY" → OKAY,
   "BAD" / "POOR" → POOR  (handles both naming conventions)
     FUTURE UPDATES: pick a consistent naming prototocol for poor posture events*/
function normaliseRating(raw) {
  if (!raw) return 'POOR';
  const v = String(raw).trim().toUpperCase();
  if (v === 'GOOD') return 'GOOD';
  if (v === 'OKAY') return 'OKAY';
  return 'POOR';
}
</script>

<!-- Firebase SDK (ES module — loads after Chart.js UMD above) 
 SEPARATE FROM MAIN SCRIPT (in a new tag) and thereby runs after the main script-->
<script type="module">
  // Added `set` to the imports so we can write to /control from the browser.
  import { initializeApp }                   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, get }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  //API KEYS 
  // should hide these away eventually, but suitable for midpoint demo 
  const firebaseConfig = {
    apiKey:            "AIzaSyDWtlCbBBEuB-d34Q76RpQ-WMwrGjo8fxM",
    authDomain:        "iot-posture-monitoring.firebaseapp.com",
    databaseURL:       "https://iot-posture-monitoring-default-rtdb.firebaseio.com",
    projectId:         "iot-posture-monitoring",
    storageBucket:     "iot-posture-monitoring.firebasestorage.app",
    messagingSenderId: "326147016174",
    appId:             "1:326147016174:web:842f22580aff6061b7baff",
  };

//init firebass app and get ref to DB
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const badge = document.getElementById('fb-badge');
  const note  = document.getElementById('fb-status-note');

const liveRef = ref(db, 'live');
const controlRef = ref(db, 'control');

let activeSessionId = "";

// SESSION TOGGLE: writes directly to Firebase's /control node.
// The output ESP polls this node periodically and reacts when `active` changes.
// We attach it to window so the button's inline onclick="toggleSession()" can find it
// (module-scope functions aren't global by default).
window.__toggleSession = async function() {
  try {
    if (sessionActive) {
      // End the current session
      await set(controlRef, {
        active: false,
        sessionId: "",
        startedAt: 0
      });
    } else {
      // Start a new session with a fresh ID
      const newSessionId = "session_" + Date.now();
      await set(controlRef, {
        active: true,
        sessionId: newSessionId,
        startedAt: Date.now()
      });
      const p = await get(ref(db, 'live/status'));
      const rating = normaliseRating(p.val());

      applyRating(rating);
      // Track local session-start time for the duration display
      liveState.sessionStart = Date.now();
    }
  } catch (err) {
    console.error('Failed to update /control in Firebase:', err);
  }
};
//LISTENER 1: fires whenever control node changes
onValue(controlRef, (snapshot) => {
  const control = snapshot.val() || {};
  activeSessionId = control.sessionId || "";
  sessionActive = !!control.active;

  updateSessionButton();

  if (sessionActive && activeSessionId) {
    badge.textContent = 'Firebase Live';
    badge.style.background = 'rgba(91,166,104,0.18)';
    badge.style.color = '#3d8a4e';
    note.innerHTML = `Active session: <strong>${activeSessionId}</strong>`;
  } else {
    badge.textContent = 'Session Inactive';
    badge.style.background = 'rgba(138,158,123,0.15)';
    badge.style.color = '#6B7D60';
    note.textContent = 'No active session';

    showInactiveSession();
    mockData.current = [];
    chart.data.datasets[0].data = mockData.current;
    chart.update();

    totalSamples = 0;
    goodSamples = 0;
    document.getElementById('good-pct').textContent = '0%';
    document.getElementById('sessions-count').textContent = '0';
  }

  if (activeSessionId) {
    const sessionRef = ref(db, `sessions_live/${activeSessionId}`);
    onValue(sessionRef, (sessionSnap) => {
      const session = sessionSnap.val() || {};

      // keep sessions today behavior exactly as your file had it
      document.getElementById('sessions-count').textContent =
        (session.totalReadings ?? 0).toString();
    });
  }
});
//LISTENER 2: fires every time the ESP32 pushes a new reading (updates ratng, timer and chart dynamically)
onValue(liveRef, (snapshot) => {
  const live = snapshot.val();

  if (!live) {
    note.textContent = 'No live data yet';
    return;
  }

  if (!sessionActive || live.status === 'INACTIVE') {
    showInactiveSession();
    return;
  }

  const rawStatus = live.status || 'BAD';
  const rating = normaliseRating(rawStatus);

  applyRating(rating);

  const durationSeconds = live.durationSeconds || 0;
  const m = String(Math.floor(durationSeconds / 60)).padStart(2, '0');
  const s = String(durationSeconds % 60).padStart(2, '0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;

  const xMinutes = parseFloat((durationSeconds / 60).toFixed(2));
  const y = rating === 'GOOD' ? 2 : rating === 'OKAY' ? 1 : 0;

  mockData.current.push({ x: xMinutes, y });
  if (mockData.current.length > 200) mockData.current.shift();

  if (document.querySelector('.tab.active').textContent.trim().toLowerCase() === 'current') {
    chart.data.datasets[0].data = mockData.current;
    chart.update('none');
  }

  note.innerHTML =
    `Status: <strong>${live.status}</strong> | Score: <strong>${live.score ?? 0}</strong> | Session: <strong>${live.sessionId || 'none'}</strong>`;
}, (error) => {
  badge.textContent = 'Firebase Error';
  badge.style.background = 'rgba(201,79,66,0.15)';
  badge.style.color = '#9b2b20';
  note.textContent = error.message;
});
</script>
</body>
